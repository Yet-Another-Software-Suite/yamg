name: YAMG Deploy

# The site serves the YAMG for each WPILib season:
#   https://yamg.yassrobotics.com/       the main branch (2027)
#   https://yamg.yassrobotics.com/2026/  the 2026 branch
# It deploys after main builds and passes its tests. After pushing to the 2026 branch, run this
# workflow by hand (Actions > YAMG Deploy > Run workflow) to publish it.
# For a new season, add its path here and in components/season-switch.tsx.

on:
  workflow_run:
    workflows: ["YAMG Build & Test"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  # The 2027 SystemCore package, served beside the site so the download button gets the one built from main
  ipk:
    if: >
      ${{
          github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push')
      }}
    uses: ./.github/workflows/build-ipk.yml

  deploy:
    needs: ipk
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out 2026
        uses: actions/checkout@v4
        with:
          ref: "2026"
          path: site-2026

      - name: Check out 2027
        uses: actions/checkout@v4
        with:
          ref: main
          path: site-2027

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build 2026
        working-directory: site-2026
        env:
          NEXT_PUBLIC_BASE_PATH: /2026
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run build

      - name: Build 2027
        working-directory: site-2027
        env:
          APP_VERSION: ${{ needs.ipk.outputs.version }}
          NEXT_PUBLIC_IPK_FILE: ${{ needs.ipk.outputs.file }}
          NEXT_PUBLIC_IPK_VERSION: ${{ needs.ipk.outputs.version }}
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run build

      - name: Put the seasons together
        run: |
          mkdir site
          cp -r site-2027/out/. site/
          mkdir site/2026
          cp -r site-2026/out/. site/2026/

      - name: Add the IPK to the site
        uses: actions/download-artifact@v4
        with:
          name: yamg-ipk
          path: ./site

      # Each attempt names its artifact, so that re-running a failed deploy does not leave two
      # artifacts with the same name, which deploy-pages refuses.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          # Pages can be slow to finish a deployment; give it longer than the 10 minute default.
          timeout: 1200000
